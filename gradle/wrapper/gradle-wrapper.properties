distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 国内网络直连 services.gradle.org 常常超时（SocketTimeoutException），
# 所以改用腾讯云镜像。若该镜像也不通，可换成：
#   https\://mirrors.aliyun.com/macports/distfiles/gradle/gradle-9.0.0-bin.zip
#   https\://mirrors.huaweicloud.com/gradle/gradle-9.0.0-bin.zip
# 也可以改成本机已下载的离线包（注意要用正斜杠）：
#   distributionUrl=file\:///D:/gradle-9.0.0-bin.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.0.0-bin.zip
networkTimeout=60000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
